{% extends "base.html" %}

{% block title %}404 Not Found — AICTE Monitoring Portal{% endblock %}

{% block content %}
<div class="gov-card">
  <div class="gov-card-body p-5 text-center">
    <div class="text-warning display-1 fw-bold mb-3"><i class="bi bi-question-circle"></i></div>
    <h3 class="fw-bold text-dark">404 &mdash; Resource Not Found</h3>
    <p class="text-muted">The requested complaint record, institution dossier, or portal endpoint does not exist or has been relocated.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-gov-primary mt-2">
      <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
